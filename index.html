<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Librory — Game Developer</title>
    <meta
      name="description"
      content="Portfolio of Librory — full-stack game developer focused on Unity and JavaScript."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191918" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Librory — Game Developer" />
    <meta
      property="og:description"
      content="Portfolio of Librory — full-stack game developer focused on Unity and JavaScript."
    />

    <script>
      // Applied before paint so the page never flashes the wrong theme.
      const stored = localStorage.getItem('librory-theme')
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.dataset.theme = stored ?? (prefersDark ? 'dark' : 'light')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
