<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>Duneloom Puzzle</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; place-items: center; overflow: hidden; background: #140d09; color: #f7e4c6; }
    main {
      position: relative;
      width: min(100vw, 46.12676vh);
      width: min(100vw, 46.12676dvh);
      aspect-ratio: 393 / 852;
      overflow: hidden;
      background: #24110b;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    canvas:focus, canvas:focus-visible { outline: none; }
    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 1rem;
      padding: 1.25rem;
      background: #24110b;
      text-align: center;
      font: 1rem / 1.45 system-ui, sans-serif;
    }
    #loading[hidden], progress[hidden], button[hidden] { display: none; }
    progress { width: min(12rem, 80%); height: 0.45rem; accent-color: #f4a037; }
    #message { margin: 0; overflow-wrap: anywhere; }
    button { padding: .5rem 1rem; border: 1px solid #c58d47; background: #3a2113; color: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main aria-label="Duneloom Puzzle">
    <canvas id="unity-canvas" width="393" height="852" tabindex="0" aria-label="Duneloom Puzzle"></canvas>
    <div id="loading">
      <p id="message" role="status">Loading Duneloom Puzzle…</p>
      <progress id="progress" aria-label="Loading progress" value="0" max="1"></progress>
      <button id="retry" type="button" hidden>Reload</button>
    </div>
  </main>
  <script>
    const canvas = document.getElementById("unity-canvas");
    const loading = document.getElementById("loading");
    const message = document.getElementById("message");
    const progress = document.getElementById("progress");
    const retry = document.getElementById("retry");
    let player = null;

    function renderPixelRatio() {
      const height = Math.max(1, canvas.clientHeight);
      // Supersample small embeds. Cap the portrait buffer at 2160px on its long edge.
      return Math.min(3, 2160 / height, Math.max(window.devicePixelRatio || 1, 1440 / height));
    }

    function updatePixelRatio() {
      if (player) player.Module.devicePixelRatio = renderPixelRatio();
    }
    new ResizeObserver(updatePixelRatio).observe(canvas);
    window.addEventListener("resize", updatePixelRatio);

    function showError(reason) {
      loading.hidden = false;
      progress.hidden = true;
      retry.hidden = false;
      message.textContent = "Unable to start the game. " + String(reason);
    }
    retry.addEventListener("click", () => window.location.reload());
    canvas.addEventListener("pointerdown", () => canvas.focus({ preventScroll: true }));

    const loader = document.createElement("script");
    loader.src = "Build/WebPortfolio.loader.js";
    loader.onerror = () => showError("The game loader could not be loaded.");
    loader.onload = () => {
      const config = {
        arguments: ["-language=en"],
        dataUrl: "Build/WebPortfolio.data.unityweb",
        frameworkUrl: "Build/WebPortfolio.framework.js.unityweb",
        codeUrl: "Build/WebPortfolio.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "NO MIRAGE",
        productName: "Duneloom",
        productVersion: "1.0.1",
        devicePixelRatio: renderPixelRatio(),
        autoSyncPersistentDataPath: true,
        showBanner(text, type) {
          if (type === "error") showError(text);
          else console.warn(text);
        }
      };
      createUnityInstance(canvas, config, value => { progress.value = value; })
        .then(instance => {
          player = instance;
          updatePixelRatio();
          if (retry.hidden) loading.hidden = true;
        })
        .catch(showError);
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
